# undernote CI — the build IS the product's runtime, so this pipeline is the
# only gate between content and readers:
#   verify:  tests → "violation must fail" proof → double build → determinism hash
#   deploy:  GitHub Pages, main branch only, and only after every gate passed.
# A failed run deploys nothing; the site keeps serving the last successful
# deployment (static-hosting property relied on by the failure design).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# R-10: all date attribution (monthly recap cutoff etc.) is computed in
# Asia/Seoul. Runners are UTC — this line is non-negotiable.
env:
  TZ: Asia/Seoul

# Least privilege (security audit UN-SEC-001): verify only reads the repo.
# deploy declares its own elevated scopes; unlisted scopes default to none.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # Lockfile-pinned install only (supply-chain rule) — never `npm install` here.
      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run check

      # Gate existence proof (W5.0 DoD): an intentional schema violation
      # (score: 8.35, unquoted) must make `astro build` exit nonzero.
      # If this build SUCCEEDS, the validation gate is dead and we fail loudly.
      - name: Schema violation must fail the build (E-105)
        run: |
          cp tests/fixtures/invalid/review-score-two-decimals.md content/reviews/
          if npm run build; then
            echo "::error::의도적 스키마 위반(score 8.35)이 빌드를 통과했습니다 — 검증 게이트가 작동하지 않습니다"
            exit 1
          fi
          rm content/reviews/review-score-two-decimals.md
          rm -rf dist .astro node_modules/.astro

      - name: Build (1st)
        run: |
          npm run build
          mv dist dist-1

      # Second build — WARM. The OG render cache (.cache/og-cards) is left in
      # place on purpose: a fresh checkout has none, so build 1 is always cold
      # and fills it, and this build then asserts the one property the cache
      # can actually break — that a cached card is byte-identical to a drawn
      # one. Astro's own caches are still cleared, so nothing else carries.
      - name: Build (2nd — warm OG cache)
        run: |
          rm -rf .astro node_modules/.astro
          npm run build
          mv dist dist-2

      # Third build — CACHE OFF, and it is here to keep the ORIGINAL gate.
      #
      # Build 2 reads cards from disk instead of drawing them. That means a
      # non-deterministic RENDERER would be baked into build 1, replayed by
      # build 2, and the two would agree — a green gate over the exact defect
      # the gate exists to catch. Build 3 draws every card again from scratch,
      # so dist-1 == dist-3 is the cold-versus-cold assertion this workflow
      # made before the cache existed, unchanged.
      #
      # Cost is one build, and it is the cheap direction to be wrong in: the
      # alternative is reasoning about which subsystems "could not possibly"
      # be non-deterministic, which is the reasoning this gate replaces.
      - name: Build (3rd — determinism, cache bypassed)
        env:
          UNDERNOTE_OG_CACHE: '0'
        run: |
          rm -rf .astro node_modules/.astro
          npm run build
          mv dist dist-3

      # Hash scope is dist/ ONLY (story AC4): reports/ contains built_at,
      # which is inherently non-deterministic and lives outside dist by design.
      - name: Determinism gate — identical input ⇒ identical dist hash
        run: |
          hash_dir() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
          h1=$(hash_dir dist-1)
          h2=$(hash_dir dist-2)
          h3=$(hash_dir dist-3)
          echo "dist-1 (cold)      : $h1"
          echo "dist-2 (warm cache): $h2"
          echo "dist-3 (no cache)  : $h3"
          if [ "$h1" != "$h3" ]; then
            echo "::error::결정성 위반 — 캐시 없이 두 번 빌드한 dist/ 해시가 다릅니다 (빌드 자체가 비결정적)"
            diff -r dist-1 dist-3 | head -50 || true
            exit 1
          fi
          if [ "$h1" != "$h2" ]; then
            echo "::error::OG 렌더 캐시 위반 — 캐시가 채워진 빌드의 dist/ 해시가 콜드 빌드와 다릅니다 (캐시가 낡은 카드를 돌려줍니다)"
            diff -r dist-1 dist-2 | head -50 || true
            exit 1
          fi

      # dist-1 is the artifact every gate above actually verified — deploy
      # exactly these bytes, never a rebuild.
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-1

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout for the fixture-content gate
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Release-only fixture gate (lead decision): fixture content may drive
      # dev/tests forever, but must never DEPLOY. Checked here — not in
      # verify — so dev builds stay green; and checked against the repo, not
      # via a rebuild, so the verified dist-1 bytes still deploy untouched
      # (atomicity argument of the pipeline is preserved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fixture content must not deploy
        run: |
          leftovers=$(find content public/covers -name 'fixture-*' -not -name '.gitkeep' 2>/dev/null || true)
          if [ -n "$leftovers" ]; then
            echo "::error::픽스처 콘텐츠가 남아 있어 배포를 중단합니다. 공개 전 다음 파일을 제거하세요:"
            echo "$leftovers"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
